// In this section you declare where to find the dependencies of your project
repositories.mavenCentral()

configurations {
    library.extendsFrom compileOnly
}

dependencies {
    api project(':barebones-commons-file')
    api project(':sevenzipjbindings')
    api 'net.sf.sevenzipjbinding:sevenzipjbinding:16.02-2.01'

    implementation 'org.apache.commons:commons-vfs2:2.3'
    implementation 'com.github.junrar:junrar:7.5.5'

    testImplementation 'org.testng:testng:7.11.0'
}

jar {
    from { configurations.library.collect { it.isDirectory() ? it : zipTree(it) } }
    bundle {
        bnd ('Bundle-Name': 'barebones-commander-rar',
                'Bundle-Vendor': 'barebones-commander',
                'Bundle-Description': 'Library with configuration tools',
                'Bundle-DocURL': 'https://github.com/e6qu/barebones-commander',
                'Export-Package': 'dev.barebones.commander.commons.file.archive.rar',
                'Bundle-Activator': 'dev.barebones.commander.commons.file.archive.rar.Activator',
                'Specification-Title': "barebones-commander",
                'Specification-Vendor': "barebones-commander contributors",
                'Specification-Version': project.version,
                'Implementation-Title': "barebones-commander",
                'Implementation-Vendor': "barebones-commander contributors",
                'Implementation-Version': revision,
                'Build-Date': new Date().format('yyyyMMdd'))
    }
}
