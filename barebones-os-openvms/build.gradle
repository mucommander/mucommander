 plugins {
     id 'biz.aQute.bnd.builder'
 }
 
 repositories.mavenCentral()
 
 dependencies {
     api project(":barebones-core")
     api project(":barebones-commons-runtime")
     api project(":barebones-os-api")
 
     // Use JUnit test framework
     testImplementation(platform('org.junit:junit-bom:5.14.1'))
     testImplementation('org.junit.jupiter:junit-jupiter')
     testRuntimeOnly('org.junit.platform:junit-platform-launcher')
 }

jar {
    bundle {
        bnd ('Bundle-Name': 'barebones-commander-os-openvms',
                'Bundle-Vendor': 'barebones-commander',
                'Bundle-Description': 'OpenVMS specifics',
                'Bundle-DocURL': 'https://github.com/e6qu/barebones-commander',
                'Bundle-Activator': 'dev.barebones.commander.desktop.openvms.Activator',
                'Export-Package': 'dev.barebones.commander.ui.process',
                'Import-Package': '*',
                'Specification-Title': "barebones-commander",
                'Specification-Vendor': "barebones-commander contributors",
                'Specification-Version': project.version,
                'Implementation-Title': "barebones-commander",
                'Implementation-Vendor': "barebones-commander contributors",
                'Implementation-Version': revision,
                'Build-Date': new Date().format('yyyyMMdd'))
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}
