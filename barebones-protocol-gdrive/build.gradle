dependencies {
    api project(':barebones-commons-file')
    api project(':barebones-protocol-api')
    api project(':barebones-encoding')
    api project(':barebones-translator')
    api project(':barebones-core')

    comprise 'com.google.api-client:google-api-client:2.0.0'
    comprise 'com.google.oauth-client:google-oauth-client-jetty:1.34.1'
    comprise 'com.google.apis:google-api-services-drive:v3-rev20220815-2.0.0'

    testImplementation(platform('org.junit:junit-bom:5.14.1'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
    testImplementation 'org.testng:testng:7.11.0'
}

repositories.mavenCentral()

jar {
    from configurations.comprise.collect { it.isDirectory() ? it : zipTree(it).matching {
        exclude 'META-INF/**'
    }}
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    bundle {
        bnd ('Bundle-Name': 'barebones-commander-gdrive',
                'Bundle-Vendor': 'barebones-commander',
                'Bundle-Description': 'Plugin for Google-Drive',
                'Bundle-DocURL': 'https://github.com/e6qu/barebones-commander',
                'Export-Package': 'dev.barebones.commander.commons.protocol.gdrive,com.google.api.client.auth.oauth2',
                'Import-Package': '!org.apache.avalon.framework.logger,!org.apache.log,!org.apache.log4j,!com.google.appengine.api,!com.google.apphosting.api,!com.google.appengine.api.utils,!io.grpc.override,*',
                'Bundle-Activator': 'dev.barebones.commander.commons.file.protocol.gdrive.Activator',
                'Specification-Title': "barebones-commander",
                'Specification-Vendor': "barebones-commander contributors",
                'Specification-Version': project.version,
                'Implementation-Title': "barebones-commander",
                'Implementation-Vendor': "barebones-commander contributors",
                'Implementation-Version': revision,
                'Build-Date': new Date().format('yyyyMMdd'))
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}
