plugins {
    id 'biz.aQute.bnd.builder'
}

test.useTestNG()

repositories.mavenCentral()

dependencies {
    api project(":barebones-commons-util")
    api project(":barebones-core")
    api project(":barebones-os-api")
    api project(":barebones-process")
    api project(":barebones-translator")

    comprise 'net.java.dev.jna:jna-platform:5.12.1'
    implementation 'com.googlecode.plist:dd-plist:1.23'

    // the java.desktop module that contains macOS-specific extensions
    compileOnly files('libs/java.desktop.jar')

    // Use JUnit test framework
    testImplementation 'org.testng:testng:7.11.0'
}

jar {
    from configurations.comprise.collect { it.isDirectory() ? it : zipTree(it).matching {
        exclude 'com/sun/jna/aix*/**'
        exclude 'com/sun/jna/freebsd*/**'
        exclude 'com/sun/jna/linux*/**'
        exclude 'com/sun/jna/openbsd*/**'
        exclude 'com/sun/jna/sunos*/**'
        exclude 'com/sun/jna/win*/**'
        exclude 'META-INF/**'
        exclude 'com/sun/jna/platform/linux/**'
        exclude 'com/sun/jna/platform/unix/**'
        exclude 'com/sun/jna/platform/win32/**'
        exclude 'com/sun/jna/platform/wince/**'
    } }

    bundle {
        bnd ('Bundle-Name': 'barebones-commander-os-macos',
                'Bundle-Vendor': 'barebones-commander',
                'Bundle-Description': 'macOS specifics',
                'Bundle-DocURL': 'https://github.com/e6qu/barebones-commander',
                'Bundle-Activator': 'dev.barebones.commander.desktop.macos.Activator',
                'Export-Package': 'dev.barebones.commander.ui.process',
                'Import-Package': '!com.sun.jna.*,*',
                'Specification-Title': "barebones-commander",
                'Specification-Vendor': "barebones-commander contributors",
                'Specification-Version': project.version,
                'Implementation-Title': "barebones-commander",
                'Implementation-Vendor': "barebones-commander contributors",
                'Implementation-Version': revision,
                'Build-Date': new Date().format('yyyyMMdd'))
    }
}
