repositories.mavenCentral()

dependencies {
    api project(':barebones-commons-file')
    api project(':barebones-protocol-api')
    api project(':barebones-translator')

    implementation 'javax.xml.ws:jaxws-api:2.2.12'

    runtimeOnly 'javax.jws:javax.jws-api:1.1'

    // Use JUnit test framework
    testImplementation(platform('org.junit:junit-bom:5.14.1'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
    api project(':barebones-commons-file')
    testImplementation 'org.testng:testng:7.11.0'
    implementation files('libs/vim25.jar')
}

jar {
    bundle {
        bnd ('Bundle-Name': 'barebones-commander-vSphere',
                'Bundle-Vendor': 'barebones-commander',
                'Bundle-Description': 'Library with configuration tools',
                'Bundle-DocURL': 'https://github.com/e6qu/barebones-commander',
                'Export-Package': 'dev.barebones.commander.commons.protocol.vsphere',
                'Bundle-Activator': 'dev.barebones.commander.commons.file.protocol.vsphere.Activator',
                'Specification-Title': "barebones-commander",
                'Specification-Vendor': "barebones-commander contributors",
                'Specification-Version': project.version,
                'Implementation-Title': "barebones-commander",
                'Implementation-Vendor': "barebones-commander contributors",
                'Implementation-Version': revision,
                'Build-Date': new Date().format('yyyyMMdd'))
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}
