repositories.mavenCentral()

dependencies {
    api project(':barebones-commons-file')

    implementation files('libs/libguestfs.jar')
}

jar {
    bundle {
        bnd ('Bundle-Name': 'barebones-commander-libguestfs',
                'Bundle-Vendor': 'barebones-commander',
                'Bundle-Description': 'Library with configuration tools',
                'Bundle-DocURL': 'https://github.com/e6qu/barebones-commander',
                'Export-Package': 'dev.barebones.commander.commons.file.archive.libguestfs',
                'Bundle-Activator': 'dev.barebones.commander.commons.file.archive.libguestfs.Activator',
                'Specification-Title': "barebones-commander",
                'Specification-Vendor': "barebones-commander contributors",
                'Specification-Version': project.version,
                'Implementation-Title': "barebones-commander",
                'Implementation-Vendor': "barebones-commander contributors",
                'Implementation-Version': revision,
                'Build-Date': new Date().format('yyyyMMdd'))
    }
}
