dependencies {
    api project(':barebones-commons-file')
    api project(':barebones-protocol-api')
    api project(':barebones-encoding')
    api project(':barebones-translator')

    implementation ('com.microsoft.graph:microsoft-graph:5.67.0') {
        exclude group: 'com.google.code.gson', module: 'gson'
    }
    implementation 'com.azure:azure-xml:1.0.0-beta.2'
    implementation 'com.azure:azure-identity:1.9.2'

    testImplementation(platform('org.junit:junit-bom:5.14.1'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')

    testImplementation 'org.testng:testng:7.11.0'
}

repositories.mavenCentral()

jar {
    bundle {
        bnd ('Bundle-Name': 'barebones-commander-onedrive',
                'Bundle-Vendor': 'barebones-commander',
                'Bundle-Description': 'Plugin for OneDrive',
                'Bundle-DocURL': 'https://github.com/e6qu/barebones-commander',
                'Export-Package': 'dev.barebones.commander.commons.protocol.onedrive',
                'Bundle-Activator': 'dev.barebones.commander.commons.file.protocol.onedrive.Activator',
                'Specification-Title': "barebones-commander",
                'Specification-Vendor': "barebones-commander contributors",
                'Specification-Version': project.version+'-'+project.ext.release,
                'Implementation-Title': "barebones-commander",
                'Implementation-Vendor': "barebones-commander contributors",
                'Implementation-Version': revision,
                'Build-Date': new Date().format('yyyyMMdd'))
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}
