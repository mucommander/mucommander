repositories.mavenCentral()

dependencies {
    api project(':barebones-core')
    api project(':barebones-commons-file')
    api project(':barebones-viewer-api')
    api project(':barebones-translator')

    comprise 'com.twelvemonkeys.imageio:imageio-core:3.12.0'

    // image plugins to handle additional types (like psd) or faster alternatives to built-in ones (jpeg)
    comprise 'com.twelvemonkeys.imageio:imageio-jpeg:3.12.0'
    comprise 'com.twelvemonkeys.imageio:imageio-tiff:3.12.0'
    comprise 'com.twelvemonkeys.imageio:imageio-psd:3.12.0'
    comprise 'com.twelvemonkeys.imageio:imageio-webp:3.12.0'
    // requirements for plugins
    comprise 'com.twelvemonkeys.common:common-lang:3.12.0'
    comprise 'com.twelvemonkeys.common:common-io:3.12.0'
    comprise 'com.twelvemonkeys.imageio:imageio-metadata:3.12.0'


    compileOnly 'com.google.code.findbugs:jsr305:1.3.9'

    testImplementation 'org.testng:testng:7.11.0'
}

jar {
    from configurations.comprise.collect { it.isDirectory() ? it : zipTree(it).matching {
        exclude 'META-INF/**'
    } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    bundle {
        bnd ('Bundle-Name': 'barebones-commander-viewer-image',
                'Bundle-Vendor': 'barebones-commander',
                'Bundle-Description': 'Library for previewing image files',
                'Bundle-DocURL': 'https://github.com/e6qu/barebones-commander',
                'Export-Package': 'dev.barebones.commander.viewer.image',
                'Import-Package': '!magick,*',
                'Bundle-Activator': 'dev.barebones.commander.viewer.image.Activator',
                'Specification-Title': "barebones-commander",
                'Specification-Vendor': "barebones-commander contributors",
                'Specification-Version': project.version,
                'Implementation-Title': "barebones-commander",
                'Implementation-Vendor': "barebones-commander contributors",
                'Implementation-Version': revision,
                'Build-Date': new Date().format('yyyyMMdd'))
    }
}
