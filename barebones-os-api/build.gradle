plugins {
    id 'biz.aQute.bnd.builder'
}

repositories.mavenCentral()

dependencies {
    api project(":barebones-commons-file")
    api project(":barebones-command")
    api project(":barebones-process")
    api project(":barebones-translator")

    // Use JUnit test framework
    testImplementation(platform('org.junit:junit-bom:5.14.1'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

jar {
    bundle {
        bnd ('Bundle-Name': 'barebones-commander-os-api',
                'Bundle-Vendor': 'barebones-commander',
                'Bundle-Description': 'Utilities and interfaces for OS plugins',
                'Bundle-DocURL': 'https://github.com/e6qu/barebones-commander',
                'Export-Package':
                        'dev.barebones.commander.os.api,' +
                                'dev.barebones.commander.desktop,' +
                                'dev.barebones.commander.os.notifier',
                'Import-Package': '*',
                'Specification-Title': "barebones-commander",
                'Specification-Vendor': "barebones-commander contributors",
                'Specification-Version': project.version,
                'Implementation-Title': "barebones-commander",
                'Implementation-Vendor': "barebones-commander contributors",
                'Implementation-Version': revision,
                'Build-Date': new Date().format('yyyyMMdd'))
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}
