repositories.mavenCentral()

dependencies {
    api project(':barebones-core')
    api project(':barebones-viewer-api')
    api project(':barebones-preferences')
    api project(':barebones-translator')
    api project(':barebones-encoding')
    api project(':barebones-commons-file')
    api project(':barebones-commons-util')
    api project(':barebones-os-api')
    // Version jsr305 3.0.2 conflicts with felix framework
    compileOnly 'com.google.code.findbugs:jsr305:1.3.9'

    implementation('org.exbin.bined:bined-core:0.2.2')
    implementation('org.exbin.bined:bined-swing:0.2.2')
    implementation('org.exbin.bined:bined-operation:0.2.2')
    implementation('org.exbin.bined:bined-operation-swing:0.2.2')
    implementation('org.exbin.bined:bined-highlight-swing:0.2.2')
    implementation('org.exbin.auxiliary:binary_data:0.2.2')
    implementation('org.exbin.auxiliary:binary_data-array:0.2.2')

    testImplementation 'org.testng:testng:7.11.0'
}

jar {
    bundle {
        bnd ('Bundle-Name': 'barebones-commander-viewer-binary',
                'Bundle-Vendor': 'barebones-commander',
                'Bundle-Description': 'Library for binary/hexadecimal viewer/editor',
                'Bundle-DocURL': 'https://github.com/e6qu/barebones-commander',
                'Export-Package': 'dev.barebones.commander.viewer.binary',
                'Bundle-Activator': 'dev.barebones.commander.viewer.binary.Activator',
                'Specification-Title': "barebones-commander",
                'Specification-Vendor': "Miroslav Hajda",
                'Specification-Version': project.version,
                'Implementation-Title': "barebones-commander",
                'Implementation-Vendor': "Miroslav Hajda",
                'Implementation-Version': revision,
                'Build-Date': new Date().format('yyyyMMdd'))
    }
}
