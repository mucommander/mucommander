repositories {
    repositories.mavenCentral()
    maven {
        url = uri("https://github.com/e6qu/barebones-commander/maven/")
    }
}

dependencies {
    api project(':barebones-commons-file')

    comprise 'net.sf.sevenzipjbinding:sevenzipjbinding:16.02-2.01'

    // Use a patched version of sevenzipjbinding-all-platforms with support for Apple silicon
    // See https://github.com/mucommander/mucommander/pull/1237
    comprise 'com.mucommander:sevenzipjbinding-all-platforms:16.02-2.01'

    testImplementation 'org.testng:testng:7.11.0'
}

jar {
    from configurations.comprise.collect { it.isDirectory() ? it : zipTree(it).matching {
        exclude 'META-INF/**'
    } }
    bundle {
        bnd ('Bundle-Name': 'barebones-commander-sevenzipjbindings',
                'Bundle-Vendor': 'barebones-commander',
                'Bundle-Description': 'Wrapper for SevenZipJBindings',
                'Bundle-DocURL': 'https://github.com/e6qu/barebones-commander',
                'Export-Package': 'dev.barebones.commander.sevenzipjbindings,net.sf.sevenzipjbinding',
                'Import-Package': '*',
                'Specification-Title': "barebones-commander",
                'Specification-Vendor': "Arik Hadas",
                'Specification-Version': project.version,
                'Implementation-Title': "barebones-commander",
                'Implementation-Vendor': "Arik Hadas",
                'Implementation-Version': revision,
                'Build-Date': new Date().format('yyyyMMdd'))
    }
}

